<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
html,body{margin:0;height:100%;background:#1b1b1b;overflow:hidden;touch-action:none}
#wrap{position:fixed;inset:0;overflow:hidden}
/* The map is a square as large as the screen's diagonal, so turning it never shows empty corners. */
#map{position:absolute;background:#1b1b1b;transform-origin:50% 50%}
#north{position:fixed;top:12px;left:12px;width:46px;height:46px;border-radius:50%;background:#000a;border:2px solid #D4A92F;z-index:1000;display:flex;align-items:center;justify-content:center}
#north svg{width:30px;height:30px}
/* Direction tracking: the map turns with the phone; this tells which way to turn. */
#trk{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:8px 18px;border-radius:20px;font:bold 18px sans-serif;z-index:1000;display:none;box-shadow:0 3px 12px #0008;white-space:nowrap}
#phoneTop{position:fixed;left:50%;top:44px;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:18px solid #fff;z-index:999;display:none;filter:drop-shadow(0 2px 3px #000)}
#cal{position:fixed;left:10px;right:10px;top:70px;background:#E9C46Af0;color:#2a1a00;border-radius:16px;padding:10px 12px;font:bold 15px sans-serif;line-height:1.5;z-index:1001;display:none}
#cal .row{display:flex;gap:8px;margin-top:8px}
#cal button{flex:1;border:0;border-radius:12px;padding:9px;font:bold 15px sans-serif}
#wall{position:fixed;left:6%;right:6%;top:50%;border-top:3px dashed #fff;z-index:998;display:none;filter:drop-shadow(0 1px 2px #000)}
#wallLab{position:fixed;left:7%;top:calc(50% - 24px);color:#fff;background:#0009;padding:1px 8px;border-radius:6px;font:12px sans-serif;z-index:998;display:none}
.kaaba{width:34px;height:34px;border-radius:50%;background:#111;border:3px solid #D4A92F;box-shadow:0 2px 8px #0008;position:relative}
.kaaba:after{content:'';position:absolute;left:7px;right:7px;top:12px;height:4px;background:#D4A92F}
.me{width:20px;height:20px;border-radius:50%;background:#1E88E5;border:4px solid #fff;box-shadow:0 0 0 2px #1E88E5aa,0 2px 8px #0008}
.leaflet-control-attribution{font-size:9px}
</style></head><body><div id="wrap"><div id="map"></div></div>
<div id="phoneTop"></div><div id="trk"></div>
<div id="wall"></div><div id="wallLab">الجدار اللي قدامك</div>
<div id="cal">📐 لف الخريطة بإصبعين لين جدار بيتك في الصورة يكون موازي للخط الأبيض المتقطع (الجدار اللي قدامك)، ورأس الجوال متجه للجدار.
<div class="row"><button style="background:#2a1a00;color:#E9C46A" onclick="endCalib(true)">✓ تم التصحيح</button><button style="background:#fff8" onclick="endCalib(false)">إلغاء</button></div></div>
<div id="north" onclick="northUp()" title="الشمال للأعلى"><svg viewBox="0 0 30 30"><path d="M15 2 L20 15 L15 13 L10 15Z" fill="#E53935"/><path d="M15 28 L20 15 L15 17 L10 15Z" fill="#fff"/><text x="15" y="10" font-size="0" fill="#fff">N</text></svg></div>
<script src="leaflet/leaflet.js"></script>
<script>
var KAABA=[21.4224779,39.8251832];
var bearing=0; // degrees the map is turned (by the user's two fingers)
function sizeMap(){var w=innerWidth,h=innerHeight,d=Math.ceil(Math.sqrt(w*w+h*h)),m=document.getElementById('map');
 m.style.width=m.style.height=d+'px';m.style.left=((w-d)/2)+'px';m.style.top=((h-d)/2)+'px';}
sizeMap();
// Leaflet's own gestures are off: the page handles one-finger pan and two-finger zoom + rotate itself.
var map=L.map('map',{zoomControl:false,attributionControl:true,maxZoom:20,zoomSnap:0,dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,keyboard:false,tap:false}).setView(KAABA,17);
addEventListener('resize',function(){sizeMap();map.invalidateSize({pan:false});});
var vscale=1; // visual zoom while two fingers are down; applied to the map for real when they lift
function applyBearing(){document.getElementById('map').style.transform='rotate('+bearing+'deg) scale('+vscale+')';
 document.querySelector('#north svg').style.transform='rotate('+bearing+'deg)';if(window.QT)QT.turned();}
function northUp(){if(tracking&&!calibrating)return;bearing=0;applyBearing();}
var tracking=false,calibrating=false;
function show(id,on){document.getElementById(id).style.display=on?'block':'none';}
function setTracking(on){tracking=on;show('phoneTop',on);show('trk',on&&!calibrating);if(on)goMe();}
// From the app, while tracking: h = heading of the phone's top, diff = degrees still to turn, ok = facing the qibla.
function track(h,diff,ok){if(!tracking||calibrating)return;bearing=-h;applyBearing();
 if(pos)map.setView(pos,map.getZoom(),{animate:false});
 var t=document.getElementById('trk');show('trk',true);
 if(ok){t.style.background='#2E7D32';t.style.color='#fff';t.textContent='✓ أنت على القبلة';}
 else{t.style.background='#FF9800';t.style.color='#2a1a00';t.textContent=(diff>0?'↻ لف يمين ':'↺ لف يسار ')+Math.round(Math.abs(diff))+'°';}}
function startCalib(){calibrating=true;show('trk',false);show('cal',true);show('wall',true);show('wallLab',true);show('phoneTop',true);goMe();}
function endCalib(ok){calibrating=false;show('cal',false);show('wall',false);show('wallLab',false);show('phoneTop',tracking);
 if(ok&&window.Q)Q.calibrated(bearing);}
(function(){var t0=null,g=null,tp=null; // g: the two-finger gesture in progress; tp: a possible tap / long press
 function commit(){ // fingers lifted: turn the visual zoom into a real zoom (tiles load once, not on every move)
  if(!g)return;var z=Math.max(3,Math.min(20,g.z+Math.log2(vscale)));g=null;vscale=1;applyBearing();map.setZoom(z,{animate:false});}
 function pts(e){return Array.prototype.map.call(e.touches,function(t){return{x:t.clientX,y:t.clientY};});}
 function pan(dx,dy){ // a finger moved (dx,dy) on screen: move the map the same way, undoing its rotation
  var a=-bearing*Math.PI/180,mx=dx*Math.cos(a)-dy*Math.sin(a),my=dx*Math.sin(a)+dy*Math.cos(a);
  map.panBy([-mx,-my],{animate:false});}
 var w=document.getElementById('wrap');
 w.addEventListener('touchstart',function(e){t0={p:pts(e),z:map.getZoom(),b:bearing};
  tp=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}:null;},{passive:false});
 w.addEventListener('touchmove',function(e){e.preventDefault();var p=pts(e);
  if(tp&&(p.length>1||Math.hypot(p[0].x-tp.x,p[0].y-tp.y)>12))tp=null;if(!t0)return;
  if(p.length===1&&t0.p.length===1){pan(p[0].x-t0.p[0].x,p[0].y-t0.p[0].y);t0.p=p;}
  else if(p.length>=2&&t0.p.length>=2){
   var a0=Math.atan2(t0.p[1].y-t0.p[0].y,t0.p[1].x-t0.p[0].x),a1=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x);
   var d0=Math.hypot(t0.p[1].x-t0.p[0].x,t0.p[1].y-t0.p[0].y),d1=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);
   var c0={x:(t0.p[0].x+t0.p[1].x)/2,y:(t0.p[0].y+t0.p[1].y)/2},c1={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
   if(!g)g={z:map.getZoom(),d:d0};
   if(!tracking||calibrating)bearing=t0.b+(a1-a0)*180/Math.PI;
   if(g.d>10){var zt=Math.max(3,Math.min(20,g.z+Math.log2(d1/g.d)));vscale=Math.pow(2,zt-g.z);}
   applyBearing();
   pan((c1.x-c0.x)/vscale,(c1.y-c0.y)/vscale);
   t0={p:p,z:map.getZoom(),b:bearing};}
  else{commit();t0={p:p,z:map.getZoom(),b:bearing};}},{passive:false});
 w.addEventListener('touchend',function(e){
  if(tp&&e.touches.length===0&&window.QT){if(Date.now()-tp.t>550)QT.hold(tp.x,tp.y);else QT.tap(tp.x,tp.y);}if(e.touches.length===0)tp=null;
  if(e.touches.length<2)commit();t0=e.touches.length?{p:pts(e),z:map.getZoom(),b:bearing}:null;});
})();
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,keepBuffer:6,attribution:'Esri, Maxar'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,keepBuffer:6,opacity:.9}).addTo(map);
L.marker(KAABA,{icon:L.divIcon({className:'',html:'<div class="kaaba"></div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);
var me=null,acc=null,line=null,cone=null,pos=null;
function rad(d){return d*Math.PI/180}function deg(r){return r*180/Math.PI}
// Great-circle (shortest path) points from a to b, as Google's Qibla Finder does.
function gc(a,b,n){var la1=rad(a[0]),lo1=rad(a[1]),la2=rad(b[0]),lo2=rad(b[1]);
 var d=2*Math.asin(Math.sqrt(Math.pow(Math.sin((la2-la1)/2),2)+Math.cos(la1)*Math.cos(la2)*Math.pow(Math.sin((lo2-lo1)/2),2)));var p=[];
 for(var i=0;i<=n;i++){var f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
  var x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2),y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2),z=A*Math.sin(la1)+B*Math.sin(la2);
  p.push([deg(Math.atan2(z,Math.sqrt(x*x+y*y))),deg(Math.atan2(y,x))]);}return p;}
// Dense near the user so the line is exact over their building.
function path(a){var near=gc(a,KAABA,4000).slice(0,60);return near.concat(gc(a,KAABA,200));}
function setMe(lat,lon,accuracy,first,picked){
 if(!picked&&window.QT&&QT.gps(lat,lon,accuracy))return; // a place picked by hand («أنا هنا») stays until the user goes back to GPS
 pos=[lat,lon];
 if(!me){me=L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:1000}).addTo(map);
  acc=L.circle(pos,{radius:accuracy,color:'#1E88E5',weight:1,fillOpacity:.12}).addTo(map);}
 else{me.setLatLng(pos);acc.setLatLng(pos).setRadius(accuracy);}
 if(line)map.removeLayer(line);
 line=L.polyline(path(pos),{color:'#FFD54F',weight:5,opacity:.95,dashArray:'1 10',lineCap:'round'}).addTo(map);
 if(first)map.setView(pos,19);}
function heading(h){if(!pos)return;var r=0.00025,pts=[pos];for(var a=h-25;a<=h+25;a+=5){pts.push([pos[0]+r*Math.cos(rad(a)),pos[1]+r*Math.sin(rad(a))/Math.cos(rad(pos[0]))]);}
 if(cone)cone.setLatLngs(pts);else cone=L.polygon(pts,{color:'#1E88E5',weight:0,fillOpacity:.3}).addTo(map);}
function goMe(){if(pos)map.setView(pos,19);}
function goKaaba(){map.setView(KAABA,18);}
function overview(){if(pos)map.fitBounds(L.latLngBounds([pos,KAABA]),{padding:[40,40]});}
</script>
<script src="qibla_tools.js"></script></body></html>
